name: فحص تباين الألوان (Contrast Check)

on:
  push:
    branches: [main]
    paths:
      - "streamlit_app.py"
      - "scripts/check_contrast.py"
  pull_request:
    branches: [main]
    paths:
      - "streamlit_app.py"
      - "scripts/check_contrast.py"
  workflow_dispatch:

jobs:
  contrast:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: تشغيل فحص التباين
        run: python3 scripts/check_contrast.py
