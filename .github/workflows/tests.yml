name: اختبارات الوحدة (Tests)

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  critical:
    name: اختبارات حرجة (تدريب · نمو · جسر)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: تثبيت اعتماديات الاختبار
        run: pip install -q pytest numpy scikit-learn
      - name: اختبارات حرجة
        run: |
          python3 -m pytest -q --tb=line \
            tests/test_model_training_agent.py \
            tests/test_agent_growth_loop.py \
            tests/test_agent_project_bridge.py \
            tests/test_system_hub.py \
            tests/test_chat_sessions.py \
            tests/test_no_unbound_local.py \
            tests/test_surah_training_monitor.py \
            tests/test_reflection_hardening.py \
            tests/test_unified_semantic_memory.py \
            tests/test_training_experience_registry.py \
            tests/test_critical_modules.py
            tests/test_mesh_network_config.py
            tests/test_tunnel_providers.py

  full:
    name: pytest + py_compile
    runs-on: ubuntu-latest
    needs: critical
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: تثبيت اعتماديات خفيفة
        run: pip install -q pytest numpy requests scikit-learn ipykernel
      - name: تشغيل pytest
        run: python3 -m pytest -q --tb=line
      - name: فحص صياغي (py_compile)
        run: |
          find . -name "*.py" -not -path "./node_modules/*" \
            -print0 | xargs -0 -I{} python3 -m py_compile {}
