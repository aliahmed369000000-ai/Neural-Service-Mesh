name: اختبارات الوحدة (Tests)

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: تثبيت الاعتماديات الخفيفة اللازمة للاختبارات
        run: pip install pytest numpy requests

      - name: تشغيل pytest
        run: python3 -m pytest -q

      - name: فحص صياغي شامل (py_compile) لكل ملفات المشروع
        run: |
          find . -name "*.py" -not -path "./node_modules/*" \
            -print0 | xargs -0 -I{} python3 -m py_compile {}
