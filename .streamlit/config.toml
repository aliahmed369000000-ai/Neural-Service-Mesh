[server]
headless = true
address = "0.0.0.0"
# CORS وXSRF protection متروكة على الإعداد الافتراضي الآمن (مفعّلة) —
# تعطيلهما معاً على تطبيق عام منشور فعلياً على الإنترنت يفتح ثغرة CSRF
# (Streamlit توصي رسمياً بعدم فعل هذا). لو ظهرت مشكلة اتصال حقيقية مرتبطة
# بـCORS مستقبلاً، عالجها بإعداد origin محدد بدل تعطيل الحماية بالكامل.

[browser]
gatherUsageStats = false

[theme]
base = "dark"
primaryColor = "#7C5CFC"
backgroundColor = "#0A0E17"
secondaryBackgroundColor = "#1B2333"
textColor = "#F1F5F9"
font = "sans serif"
