# تشغيل دائم لعقد الشبكة (28 افتراضياً) مع إعادة تشغيل تلقائية على مستويين:
#   • داخل الحاوية: ai/mesh_supervisor.py يعيد تشغيل أي عقدة تنهار/تتجمّد.
#   • خارجها: restart: always + healthcheck يعيدان الحاوية كلها بعد انهيار/إعادة الجهاز.
#
# الاستخدام:
#   cp config/mesh.env.example .env.mesh   # ثم ضع مفاتيحك فيه (لا يُرفع: .gitignore)
#   docker compose -f docker-compose.mesh.yml up -d --build
#
# الأسرار تُقرأ من .env.mesh فقط ولا تُكتب في هذا الملف.
services:
  nsm-mesh:
    build: .
    container_name: nsm-mesh
    command: python scripts/run_local_mesh.py
    restart: always
    env_file:
      - path: .env.mesh
        required: false
    environment:
      - NSM_NODE_COUNT=${NSM_NODE_COUNT:-28}
      - PORT=7860
      - NSM_SUPERVISE=1
      - NSM_BRIDGE_DIR=/bridge
    ports:
      - "7860-7887:7860-7887"
    volumes:
      - nsm_mesh_data:/app/artifacts
      - nsm_mesh_bridge:/bridge
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:7860/status"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 120s

  # ── نموذج مفتوح الأوزان محلي (اختياري): docker compose --profile local-llm up -d ──
  # ثم ضع في .env.mesh:  NSM_LOCAL_LLM_URL=http://ollama:11434
  # (والنموذج بـNSM_LOCAL_MODEL، ولكود البرمجة NSM_LOCAL_CODE_MODEL). عندها تجيب
  # العقد من النموذج المحلي أولاً (البيانات لا تغادر جهازك)، وGroq/HF احتياط.
  # تنبيه: خادم واحد مشترك بين العقد؛ على CPU النموذج 7B بطيء (جرّب qwen2.5:3b)،
  # وعلى GPU أسرع بكثير (أضف deploy.resources.reservations.devices لخدمة ollama).
  ollama:
    image: ollama/ollama
    container_name: nsm-ollama
    profiles: ["local-llm"]
    restart: always
    volumes:
      - nsm_ollama:/root/.ollama
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s

  ollama-init:
    image: ollama/ollama
    container_name: nsm-ollama-init
    profiles: ["local-llm"]
    depends_on:
      ollama:
        condition: service_healthy
    restart: "no"
    env_file:
      - path: .env.mesh
        required: false
    environment:
      - OLLAMA_HOST=http://ollama:11434
    entrypoint:
      - /bin/sh
      - -c
      - |
        ollama pull "$${NSM_LOCAL_MODEL:-qwen2.5:7b-instruct-q4_K_M}"
        if [ -n "$${NSM_LOCAL_CODE_MODEL:-}" ] && [ "$${NSM_LOCAL_CODE_MODEL}" != "$${NSM_LOCAL_MODEL:-qwen2.5:7b-instruct-q4_K_M}" ]; then
          ollama pull "$${NSM_LOCAL_CODE_MODEL}"
        fi

volumes:
  nsm_mesh_data:
  nsm_mesh_bridge:
  nsm_ollama:
