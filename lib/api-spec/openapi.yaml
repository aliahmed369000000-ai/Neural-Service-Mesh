openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: API specification
servers:
  - url: /
    description: NSM API root
tags:
  - name: health
    description: Health operations
  - name: agent
    description: NSM Agent operations
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
  /api/agent/tasks:
    post:
      operationId: createAgentTask
      tags: [agent]
      summary: Execute a public-URL agent task
      security:
        - ApiKeyAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AgentTaskRequest"
      responses:
        "200":
          description: Completed task
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AgentTaskResponse"
        "400": {description: Invalid task or URL}
        "403": {description: Invalid API key}
  /api/agent/tasks/{task_id}:
    get:
      operationId: getAgentTask
      tags: [agent]
      summary: Retrieve a completed agent task
      security:
        - ApiKeyAuth: []
      parameters:
        - name: task_id
          in: path
          required: true
          schema: {type: integer}
      responses:
        "200":
          description: Stored task
        "403": {description: Invalid API key}
        "404": {description: Task not found}
  /agents/chat:
    post:
      operationId: agentsChat
      tags: [agent]
      summary: Chat with the unified NSM agent
      security:
        - ApiKeyAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ChatRequest"
      responses:
        "200":
          description: Agent response
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ChatResponse"
        "400": {description: Missing message}
        "403": {description: Invalid API key}
        "413": {description: Message too long}
  /agents/states:
    get:
      operationId: agentsStates
      tags: [agent]
      summary: Get current agent states
      security: [{ApiKeyAuth: []}]
      responses:
        "200":
          description: Agent states and performance
  /agents/events:
    get:
      operationId: agentsEvents
      tags: [agent]
      summary: Get recent agent events
      security: [{ApiKeyAuth: []}]
      parameters:
        - {name: limit, in: query, schema: {type: integer, minimum: 1, maximum: 500, default: 80}}
      responses:
        "200": {description: Recent events}
  /swarm/dashboard:
    get:
      operationId: swarmDashboard
      tags: [agent]
      summary: Get unified swarm dashboard
      security: [{ApiKeyAuth: []}]
      responses:
        "200": {description: Swarm dashboard}
  /swarm/alerts:
    get:
      operationId: swarmAlerts
      tags: [agent]
      summary: Evaluate swarm alerts
      security: [{ApiKeyAuth: []}]
      responses:
        "200": {description: Alerts}
  /swarm/apply-actions:
    post:
      operationId: swarmApplyActions
      tags: [agent]
      summary: Apply enabled automatic swarm actions
      security: [{ApiKeyAuth: []}]
      responses:
        "200": {description: Applied actions}
  /swarm/long-horizon:
    get:
      operationId: swarmLongHorizon
      tags: [agent]
      summary: Get long-horizon task status
      security: [{ApiKeyAuth: []}]
      responses:
        "200": {description: Long-horizon tasks}
  /performance/system:
    get:
      operationId: systemPerformance
      tags: [agent]
      summary: Get system performance metrics
      security: [{ApiKeyAuth: []}]
      responses:
        "200": {description: Performance metrics}
components:
  securitySchemes:
    ApiKeyAuth:
      type: apiKey
      in: header
      name: X-API-Key
  schemas:
    HealthStatus:
      type: object
      properties:
        status: {type: string}
      required: [status]
    AgentTaskRequest:
      type: object
      required: [task, url]
      properties:
        task: {type: string, maxLength: 800}
        url: {type: string, format: uri}
        agent: {type: string, default: default, maxLength: 120}
    AgentTaskResponse:
      type: object
      properties:
        task_id: {type: integer}
        status: {type: string, enum: [completed]}
        score: {type: integer, minimum: 0, maximum: 100}
        result: {type: string}
        sources:
          type: array
          items: {type: string, format: uri}
      required: [task_id, status, result]
    ChatRequest:
      type: object
      properties:
        message: {type: string, minLength: 1, maxLength: 12000}
        prompt: {type: string, minLength: 1, maxLength: 12000}
      description: Provide message or prompt.
      minProperties: 1
    ChatResponse:
      type: object
      properties:
        ok: {type: boolean}
        answer: {type: string}
        metadata: {type: object, additionalProperties: true}
        model: {type: object, additionalProperties: true}
      required: [ok]

